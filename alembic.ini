[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment file as a
# standalone script, false otherwise
# standalone = false

# enable multiple heads
# multiple_heads = false

# if true, sqlalchemy-migrate is used
# sqlalchemy_migrate = false

# set to 'true' to prepend the revision number
# to the file template
# revision_environment = false

# set to 'true' to use relative path from config file
# for sql scripts
# sourceless = false

# if true, a file is written to the current directory
# the first time alembic is run, to track the location
# of the config file
# output_encoding = utf-8

# sqlalchemy url
#
# Deliberately NOT set here. alembic/env.py resolves the URL from $DATABASE_URL
# (falling back to settings.database_url) and calls config.set_main_option().
#
# Defining it here as `%(DATABASE_URL)s` was actively harmful: ConfigParser
# applies pyformat interpolation to this section, so any raw `%` in a database
# password (common in generated RDS credentials) raises InterpolationSyntaxError
# before a single migration runs.

[post_write_hooks]
# No hooks. A `black` hook was configured here previously, but black is not in
# any dependency group — `alembic revision --autogenerate` failed on it.
# Formatting is owned by ruff (see pyproject.toml).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# -----------------------------------------------------------------------------
# Handler + formatter definitions.
#
# These were missing. `[handlers] keys = console` and `[formatters] keys =
# generic` above promise sections named `[handler_console]` and
# `[formatter_generic]`; without them logging.config.fileConfig() — called from
# alembic/env.py — raises KeyError before any migration logic runs, so EVERY
# alembic invocation exited 1 on every platform.
# -----------------------------------------------------------------------------

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S